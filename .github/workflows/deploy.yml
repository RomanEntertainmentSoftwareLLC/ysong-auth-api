name: Deploy ysong-auth-api to VM

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SSH_HOST: ${{ secrets.VM_HOST }}
      SSH_USER: ${{ secrets.VM_USER }}
      SSH_KEY:  ~/.ssh/ysong_ci
      SSH_OPTS: -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=no

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VM_SSH_KEY }}" > "$SSH_KEY"
          chmod 600 "$SSH_KEY"
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Test SSH connectivity
        run: |
          ssh -vvv -i "$SSH_KEY" $SSH_OPTS \
            "$SSH_USER@$SSH_HOST" "echo OK on \$(hostname); whoami"

      - name: Ensure remote dir & ownership
        run: |
          ssh -i "$SSH_KEY" $SSH_OPTS \
            "$SSH_USER@$SSH_HOST" \
            "sudo mkdir -p /opt/ysong-auth && sudo chown -R \$(whoami):\$(whoami) /opt/ysong-auth"

      - name: Rsync code to VM
        run: |
          rsync -avz --delete \
            --exclude '.env' \
            --exclude 'node_modules' \
            --exclude '.git' \
            --exclude '*.log' \
            -e "ssh -i $SSH_KEY $SSH_OPTS" \
            ./ "$SSH_USER@$SSH_HOST:/opt/ysong-auth/"

      - name: Install & restart on VM
        run: |
          ssh -i "$SSH_KEY" $SSH_OPTS "$SSH_USER@$SSH_HOST" << 'EOF'
          set -e
          cd /opt/ysong-auth
          npm ci
          sudo systemctl restart ysong-auth
          sudo systemctl status ysong-auth --no-pager -l | tail -n 30
          EOF
